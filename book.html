<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星航海 · 一本杂志</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500&family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4efe4;--ink:#1c1a17;--dim:#6b6156;--red:#b23a2f;--gold:#c9a45c}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Sans SC",sans-serif;background:#05060a;color:var(--paper);min-height:100vh;overflow:hidden}
#stars{position:fixed;inset:0;z-index:0}
/* 舞台：黑色星空，中间一束顶光 */
#stage{position:relative;z-index:1;height:100vh;overflow:hidden;
  background:radial-gradient(70% 55% at 50% 38%,rgba(201,164,92,.10),transparent 70%)}
/* ── 书 ─────────────────────────────── */
#book{position:absolute;left:50%;top:50%;width:820px;height:580px;perspective:2600px;
  transform:translate(-50%,-50%) scale(var(--s,1)) translateX(var(--tx,0));transition:transform .9s cubic-bezier(.3,.1,.2,1)}
.sheet{position:absolute;left:50%;top:0;width:410px;height:580px;transform-origin:left center;
  transform-style:preserve-3d;will-change:transform}
.sheet.flipped{transform:rotateY(-180deg)}
/* 翻页动画：中段抬升翘起 + 缓动收势 */
.sheet.fwd{animation:flipFwd var(--dur,950ms) cubic-bezier(.42,.04,.25,1) both}
.sheet.bwd{animation:flipBack var(--dur,950ms) cubic-bezier(.42,.04,.25,1) both}
@keyframes flipFwd{
  0%{transform:rotateY(0)}
  45%{transform:rotateY(-84deg) translateZ(34px)}
  100%{transform:rotateY(-180deg)}
}
@keyframes flipBack{
  0%{transform:rotateY(-180deg)}
  55%{transform:rotateY(-96deg) translateZ(34px)}
  100%{transform:rotateY(0)}
}
/* 翻动中的纸面光泽：明暗带随页面扫过 */
.gloss{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;
  background:linear-gradient(100deg,rgba(0,0,0,.30),rgba(0,0,0,0) 42%,rgba(255,252,240,.55) 50%,rgba(0,0,0,0) 58%,rgba(0,0,0,.26))}
.sheet.fwd .gloss,.sheet.bwd .gloss{animation:gloss var(--dur,950ms) ease both}
@keyframes gloss{0%{opacity:0}40%{opacity:.85}100%{opacity:0}}
/* 掀起页落在右页书脊侧的投影 */
#cast{position:absolute;top:0;bottom:0;left:50%;width:130px;z-index:400;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,rgba(0,0,0,.32),transparent)}
#cast.on{animation:cast var(--dur,950ms) ease both}
@keyframes cast{0%{opacity:0}45%{opacity:1}100%{opacity:0}}
/* 书口纸页毛边（厚度感） */
.edge{position:absolute;top:7px;bottom:7px;width:8px;border-radius:2px;z-index:1;
  background:repeating-linear-gradient(180deg,#efe9da 0 3px,#b5ae9e 3px 5px);
  box-shadow:0 14px 34px rgba(0,0,0,.5)}
.edge.r{left:calc(50% + 407px)}
.edge.l{left:calc(50% - 415px);opacity:0;transition:opacity .7s}
#book:not(.closed) .edge.l{opacity:1}
/* 摊开后的中缝阴影 */
#gutter{position:absolute;top:0;bottom:0;left:calc(50% - 30px);width:60px;z-index:420;pointer-events:none;
  opacity:0;transition:opacity .7s;
  background:linear-gradient(90deg,transparent,rgba(28,26,23,.15) 45%,rgba(28,26,23,.22) 50%,rgba(28,26,23,.15) 55%,transparent)}
#book:not(.closed) #gutter{opacity:1}
/* 悬停页角卷起，提示可点击翻页 */
.face::before{content:"";position:absolute;bottom:0;width:38px;height:38px;z-index:4;opacity:0;transition:.3s;pointer-events:none}
.face.front::before{right:0;background:linear-gradient(315deg,#cfc8b6 0%,#fffdf4 46%,rgba(28,26,23,.20) 50%,transparent 53%)}
.face.back::before{left:0;background:linear-gradient(225deg,#cfc8b6 0%,#fffdf4 46%,rgba(28,26,23,.20) 50%,transparent 53%)}
.face:hover::before{opacity:1}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--paper);color:var(--ink);
  overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.55);cursor:grab}
.face:active{cursor:grabbing}
.face.back{transform:rotateY(180deg)}
/* 书脊侧阴影 */
.face.front::after,.face.back::after{content:"";position:absolute;top:0;bottom:0;width:34px;pointer-events:none}
.face.front::after{left:0;background:linear-gradient(90deg,rgba(28,26,23,.22),transparent)}
.face.back::after{right:0;background:linear-gradient(-90deg,rgba(28,26,23,.22),transparent)}
/* ── 封面 / 封底 ────────────────────── */
.cover{background:linear-gradient(160deg,#10131d 0%,#05060a 55%,#15100c 100%);color:var(--paper);
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer}
.cover .frame{position:absolute;inset:18px;border:1px solid rgba(201,164,92,.5);pointer-events:none}
.cover .frame::before{content:"";position:absolute;inset:5px;border:.5px solid rgba(201,164,92,.28)}
.cover .est{font-family:"Playfair Display",serif;letter-spacing:5px;font-size:11px;color:var(--gold);text-transform:uppercase}
.cover h1{font-family:"Playfair Display","Noto Serif SC",serif;font-weight:900;font-size:36px;line-height:1.2;margin:26px 0 10px;padding:0 14px}
.cover h1 .dot{color:var(--red)}
.cover .issue{font-family:"Playfair Display",serif;font-style:italic;font-size:14px;color:rgba(244,239,228,.75)}
.cover .open-hint{position:absolute;bottom:44px;left:0;right:0;font-family:"Playfair Display",serif;
  font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.cover .brand{font-family:"Playfair Display",serif;font-size:13px;letter-spacing:6px;color:rgba(201,164,92,.9)}
/* ── 内页通用 ────────────────────────── */
.page{padding:38px 40px;height:100%;display:flex;flex-direction:column}
.page-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(28,26,23,.25);
  padding-bottom:10px;margin-bottom:8px;font-family:"Playfair Display",serif;font-size:11px;letter-spacing:2px;
  text-transform:uppercase;color:var(--dim)}
.page-head b{color:var(--red);font-size:13px}
.pageno{margin-top:auto;text-align:center;font-family:"Playfair Display",serif;font-size:12px;color:var(--dim);
  letter-spacing:2px;padding-top:10px}
/* ── 搜索页 ──────────────────────────── */
.search-page{justify-content:center;align-items:center;text-align:center}
.search-page .mast{font-family:"Playfair Display","Noto Serif SC",serif;font-weight:900;font-size:30px;padding:0 10px}
.search-page .mast .dot{color:var(--red)}
.search-page .sub{font-family:"Playfair Display",serif;font-style:italic;color:var(--dim);margin:8px 0 34px;font-size:14px}
#q{width:86%;padding:12px 6px;border:none;border-bottom:2px solid var(--ink);background:transparent;text-align:center;
  font-family:"Playfair Display","Noto Serif SC",serif;font-size:19px;font-style:italic;color:var(--ink);outline:none}
#q:focus{border-color:var(--red)}
#resLine{margin-top:14px;min-height:20px;font-size:13px;color:var(--dim)}
#resLine b{color:var(--red)}
.keys{margin-top:30px;font-family:"Playfair Display",serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)}
/* ── 卷首目录（检索页内） ─────────────── */
.toc-lead{width:82%;margin-top:26px;text-align:left}
.toc-lead .tl-head{font-family:"Playfair Display",serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;
  color:var(--gold);border-bottom:1px solid rgba(28,26,23,.2);padding-bottom:6px}
.toc-lead .tl-row{display:flex;align-items:baseline;gap:8px;padding:7px 2px;cursor:pointer;border-bottom:1px dotted rgba(28,26,23,.22);transition:.18s}
.toc-lead .tl-row:hover{color:var(--red);padding-left:8px}
.toc-lead .tl-row .n{font-family:"Playfair Display","Noto Serif SC",serif;font-size:14px}
.toc-lead .tl-row .d{flex:1;border-bottom:1px dotted rgba(28,26,23,.35);transform:translateY(-3px)}
.toc-lead .tl-row .c{font-size:11px;color:var(--dim)}
.toc-lead .tl-row .p{font-family:"Playfair Display",serif;font-size:13px;color:var(--red)}
/* ── DeepSeek 鲸鱼娘：可移动 + 可聊天 ─────── */
#mascot{position:fixed;left:0;top:0;z-index:60;width:140px;cursor:grab;user-select:none;-webkit-tap-highlight-color:transparent}
#mascot.grabbing{cursor:grabbing}
#mascot .rig{will-change:transform}
#mascot .pet{width:140px;height:auto;display:block;filter:drop-shadow(0 12px 26px rgba(77,107,254,.5));animation:bob 3.4s ease-in-out infinite;transition:filter .25s}
#mascot:hover .pet{filter:drop-shadow(0 12px 32px rgba(125,155,255,.75))}
#mascot.jump .pet{animation:petJump .55s ease}
@keyframes bob{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-9px) scaleY(1.015)}}
@keyframes petJump{30%{transform:translateY(-18px) rotate(-7deg)}60%{transform:translateY(3px) rotate(2deg)}}
.fx{position:fixed;z-index:61;pointer-events:none;animation:fxUp 1.15s ease-out forwards}
@keyframes fxUp{0%{opacity:0;transform:translateY(6px) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-56px) scale(1.25)}}
#mBubble{position:absolute;right:4px;bottom:242px;max-width:240px;padding:10px 14px;border-radius:14px 14px 4px 14px;
  background:rgba(250,249,244,.96);color:var(--ink);font-size:12.5px;line-height:1.65;box-shadow:0 10px 26px rgba(0,0,0,.4);
  opacity:0;transform:translateY(10px) scale(.96);transition:.3s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#mBubble.show{opacity:1;transform:none}
#mChat{position:absolute;right:0;bottom:298px;display:none;gap:6px;align-items:center}
#mIn{width:180px;padding:8px 11px;border-radius:12px;border:1px solid rgba(77,107,254,.6);background:rgba(10,12,20,.88);
  color:#eef2ff;font-size:12px;outline:none;font-family:inherit;backdrop-filter:blur(8px)}
#mIn:focus{border-color:#6d8bff;box-shadow:0 0 0 3px rgba(77,107,254,.25)}
#mChat button{width:30px;height:30px;border-radius:10px;border:1px solid rgba(77,107,254,.55);
  background:rgba(10,12,20,.85);color:#9fb4ff;font-size:13px;cursor:pointer;transition:.2s}
#mChat button:hover{transform:scale(1.12);color:#fff}
#mHide{position:absolute;top:-4px;right:-6px;width:24px;height:24px;border-radius:50%;z-index:2;
  border:1px solid rgba(201,164,92,.5);background:rgba(10,12,20,.75);color:var(--gold);font-size:11px;
  cursor:pointer;opacity:0;transition:.25s}
#mascot:hover #mHide{opacity:1}
#mascot.gone{display:none}
#petChip{position:fixed;right:34px;bottom:92px;z-index:60;display:none;width:46px;height:46px;border-radius:50%;
  place-items:center;border:1px solid rgba(77,107,254,.65);background:rgba(10,12,20,.72);font-size:23px;cursor:pointer;
  backdrop-filter:blur(8px);transition:.25s}
#petChip:hover{transform:scale(1.1);box-shadow:0 0 20px rgba(77,107,254,.5)}
.bub{position:fixed;z-index:59;width:9px;height:9px;border-radius:50%;pointer-events:none;
  border:1px solid rgba(127,208,255,.9);animation:bubUp 1.3s ease-out forwards}
@keyframes bubUp{to{transform:translateY(-54px) scale(.35);opacity:0}}
/* ── 条目页 ──────────────────────────── */
.entry{display:flex;gap:14px;padding:15px 10px;border-bottom:1px solid rgba(28,26,23,.14);text-decoration:none;color:var(--ink);
  position:relative;transition:background .25s}
.entry:hover{background:rgba(178,58,47,.06)}
.entry .fav{width:40px;height:40px;flex:none;display:grid;place-items:center;border:1px solid rgba(28,26,23,.2);
  background:#fff;overflow:hidden;font-size:19px}
.entry .fav img{width:24px;height:24px;object-fit:contain}
.entry h3{font-family:"Playfair Display","Noto Serif SC",serif;font-size:17px;font-weight:700}
.entry h3 small{font-family:"Playfair Display",serif;font-weight:400;font-size:10px;color:var(--dim);letter-spacing:1px;margin-left:8px}
.entry p{font-family:"Noto Serif SC",serif;font-size:12px;color:var(--dim);line-height:1.6;margin-top:3px}
.entry .visits{position:absolute;right:10px;top:16px;font-family:"Playfair Display",serif;font-style:italic;font-size:11px;color:var(--red)}
.entry.spot{animation:spot 1.1s ease 2}
@keyframes spot{0%,100%{background:transparent}45%{background:rgba(178,58,47,.18)}}
/* ── HUD ────────────────────────────── */
#hud{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:18px;
  background:rgba(10,12,20,.72);border:1px solid rgba(201,164,92,.35);backdrop-filter:blur(10px);
  padding:10px 20px;border-radius:999px;font-family:"Playfair Display",serif}
#hud button{background:none;border:none;color:var(--gold);font-size:17px;cursor:pointer;font-family:inherit;
  padding:4px 10px;transition:.2s;letter-spacing:1px}
#hud button:hover{color:#fff;transform:scale(1.12)}
#hud .pg{font-size:12px;letter-spacing:2px;color:rgba(244,239,228,.8);min-width:86px;text-align:center}
#title{position:fixed;top:24px;left:0;right:0;text-align:center;z-index:5;font-family:"Playfair Display",serif;
  font-size:11px;letter-spacing:5px;text-transform:uppercase;color:rgba(201,164,92,.75);pointer-events:none}
/* ── 书签管理抽屉 ─────────────────────── */
#mgr{position:fixed;top:0;right:0;height:100vh;width:min(380px,92vw);z-index:70;transform:translateX(105%);
  transition:.35s cubic-bezier(.2,.8,.2,1);background:rgba(12,14,22,.95);border-left:1px solid rgba(201,164,92,.4);
  backdrop-filter:blur(14px);padding:22px 26px 40px;overflow-y:auto;color:var(--paper);font-size:13px}
#mgr.open{transform:none}
#mgr h3{font-family:"Playfair Display",serif;letter-spacing:2px;color:var(--gold);font-size:16px;margin-bottom:6px}
#mgr h4{margin:20px 0 4px;font-family:"Playfair Display",serif;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:rgba(201,164,92,.8)}
#mgr .hint{color:rgba(244,239,228,.55);font-size:11.5px;line-height:1.7;margin-bottom:6px}
#mgr label{display:block;font-size:11px;color:rgba(244,239,228,.6);margin:10px 0 4px;letter-spacing:1px}
#mgr input,#mgr select{width:100%;padding:9px 11px;border-radius:8px;border:1px solid rgba(201,164,92,.35);
  background:rgba(244,239,228,.06);color:var(--paper);font-size:13px;outline:none;font-family:inherit;box-sizing:border-box}
#mgr input:focus,#mgr select:focus{border-color:var(--gold)}
#mgr select option{color:#1c1a17}
#mgr .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
#mgr .row button{flex:1;min-width:130px}
#mgr .pri{background:var(--gold);border:none;color:#14100a;padding:10px 14px;border-radius:8px;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:600;letter-spacing:1px;transition:.2s}
#mgr .pri:hover{filter:brightness(1.15)}
#mgr .gh{background:none;border:1px solid rgba(201,164,92,.5);color:var(--gold);padding:9px 14px;border-radius:8px;
  cursor:pointer;font-family:inherit;font-size:13px;transition:.2s}
#mgr .gh:hover{background:rgba(201,164,92,.15)}
#mgrClose{position:absolute;top:14px;right:14px;background:none;border:1px solid rgba(201,164,92,.4);border-radius:50%;
  width:28px;height:28px;color:var(--gold);cursor:pointer;font-size:12px}
#mgrClose:hover{background:rgba(201,164,92,.2)}
#gTip{margin-top:12px;font-size:11.5px;color:#8fd9a8;min-height:17px;line-height:1.6}
#mgr ul{list-style:none;margin:6px 0 0;padding:0}
#mgr li{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 0;border-bottom:1px dashed rgba(201,164,92,.22)}
#mgr li b{font-weight:600;font-size:12.5px}
#mgr li small{color:rgba(244,239,228,.45);font-size:10.5px}
#mgr li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
#mgr li button{background:none;border:none;color:var(--gold);cursor:pointer;font-size:13px;padding:3px 7px;flex:none}
#mgr li button:hover{filter:brightness(1.4)}
@media (prefers-reduced-motion:reduce){.sheet,#book{transition-duration:.01ms!important}.sheet.fwd,.sheet.bwd,.gloss,#cast.on{animation-duration:.01ms!important}#mascot .pet{animation:none!important}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="title">The Navigator · A Bookmark Magazine</div>
<div id="stage"><div id="book"></div></div>
<div id="hud">
  <button id="prevBtn" title="上一页（←）">◀</button>
  <span class="pg" id="pgNo">封面</span>
  <button id="nextBtn" title="下一页（→）">▶</button>
  <button id="sndBtn" title="翻页音效开关">🔊</button>
  <button id="mgrBtn" title="管理书签（增删改 · 导出配置）">✎</button>
</div>

<aside id="mgr">
  <button id="mgrClose" title="关闭">✕</button>
  <h3>编辑书签</h3>
  <p class="hint">改动只存在你的浏览器（localStorage），不影响源文件；「导出」可复制完整 config.js 代码替换源文件，永久固化。</p>
  <label>名称 *</label><input id="gName" placeholder="例如：Qoder" autocomplete="off">
  <label>链接 *</label><input id="gUrl" placeholder="https://…" autocomplete="off">
  <label>描述</label><input id="gDesc" placeholder="一句话介绍（可留空）" autocomplete="off">
  <label>分组</label><select id="gGroup"></select>
  <label>标签（逗号分隔）</label><input id="gTags" placeholder="工具, ai" autocomplete="off">
  <div class="row">
    <button class="pri" id="gAdd">✦ 添加</button>
    <button class="gh" id="gCancel" style="display:none">取消编辑</button>
  </div>
  <div class="row">
    <button class="pri" id="gApply">↻ 应用并刷新书页</button>
    <button class="gh" id="gExport">📋 导出 config.js</button>
  </div>
  <div id="gTip"></div>
  <h4>本机自定义条目</h4><ul id="gExtra"></ul>
  <h4>源条目（🗑 = 本机隐藏）</h4><ul id="gSrc"></ul>
  <h4>已隐藏的源条目</h4><ul id="gHid"></ul>
</aside>

<div id="mascot" title="DeepSeek 鲸鱼娘">
  <div id="mBubble"></div>
  <div id="mChat">
    <input id="mIn" placeholder="和鲸鱼娘说点什么…" autocomplete="off">
    <button id="mSend" title="发送">➤</button>
    <button id="mActSwim" title="让她游一个">🌊</button>
    <button id="mActWalk" title="让她走走/爬爬">🐾</button>
  </div>
  <button id="mHide" title="收起鲸鱼娘">✕</button>
  <div class="rig"><img class="pet" src="assets/whale-girl.png" alt="DeepSeek 鲸鱼娘" draggable="false"></div>
</div>
<button id="petChip" title="召唤鲸鱼娘">🐋</button>
<script src="config.js"></script>
<script>
(() => {
  const CFG = window.NAV_CONFIG;
  const $ = s => document.querySelector(s);
  const readLS = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const extra = readLS("nav.extra", []);
  let hidden = readLS("nav.hidden", []);
  const links = [...CFG.links, ...extra].filter(l => !hidden.includes(l.url));
  const stats = readLS("nav.stats", {});
  const order = readLS("nav.order", []);
  const cats = CFG.categories;
  const groupName = id => (cats.find(c => c.id === id) || {}).name || id;
  const emojiOf = g => (cats.find(c => c.id === g) || {}).emoji || "🔗";
  const host = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } };
  const visits = u => (stats[u] || {}).c || 0;

  // 应用用户拖拽保存的顺序
  const ordIdx = u => { const i = order.findIndex(o => o.u === u); return i === -1 ? Infinity : i; };
  links.sort((a, b) => (ordIdx(a.url) - ordIdx(b.url)) || 0);

  // ── 组页：封面 → 检索页(含卷首目录) → 条目页(每页4条) → 详细目录页 → 封底 ──
  const PER = 4;
  const pages = [];
  pages.push({ type: "cover" });
  pages.push({ type: "search" });
  for (let i = 0; i < links.length; i += PER) pages.push({ type: "list", items: links.slice(i, i + PER), from: i });
  pages.push({ type: "toc" });
  pages.push({ type: "back" });
  if (pages.length % 2) pages.splice(pages.length - 1, 0, { type: "blank" });

  const favicon = l => { if (l.icon) return l.icon;
    try { return `https://www.google.com/s2/favicons?domain=${new URL(l.url).hostname}&sz=128`; } catch { return ""; } };

  const entryHTML = (l, i) => `<a class="entry" data-url="${l.url}" href="${l.url}" target="_blank" rel="noopener">
      <span class="fav">${favicon(l) ? `<img src="${favicon(l)}" loading="lazy" onerror="this.outerHTML='${emojiOf(l.group)}'">` : emojiOf(l.group)}</span>
      <span><h3>${l.name}<small>${groupName(l.group)} · ${host(l.url)}</small></h3><p>${l.desc || "—"}</p></span>
      ${visits(l.url) ? `<span class="visits">已阅 ${visits(l.url)} 次</span>` : ""}
    </a>`;

  const pageHTML = (p, i) => {
    if (p.type === "cover") return `<div class="cover" style="height:100%">
        <div class="frame"></div>
        <div class="est">Est. 2026 · Monthly</div>
        <h1>${CFG.site.name.replace("·", '<span class="dot">·</span>')}</h1>
        <div class="issue">${CFG.site.tagline}</div>
        <div class="brand">BOOKMARKS</div>
        <div class="open-hint">— 点击封面 · 翻开这一期 —</div>
      </div>`;
    if (p.type === "search") {
      const firstOf = {};
      links.forEach((l, idx) => { if (firstOf[l.group] === undefined) firstOf[l.group] = { page: Math.floor(idx / PER) + 2, n: 0 }; firstOf[l.group].n++; });
      return `<div class="page search-page">
        <div class="mast">${CFG.site.name.replace("·", '<span class="dot">·</span>')}</div>
        <div class="sub">Search the index, turn to the page</div>
        <input id="q" placeholder="检索条目…" autocomplete="off">
        <div id="resLine">共收录 <b>${links.length}</b> 条</div>
        <div class="toc-lead">
          <div class="tl-head">Contents · 卷首目录</div>
          ${Object.entries(firstOf).map(([g, x]) => `<div class="tl-row" data-jump="${x.page}">
              <span class="n">${emojiOf(g)} ${groupName(g)}</span><span class="d"></span>
              <span class="c">${x.n} 条</span><span class="p">P.${String(x.page).padStart(2, "0")}</span></div>`).join("")}
        </div>
        <div class="keys">← → 翻页 · 点击书页边缘亦可翻页</div>
      </div>`;
    }
    if (p.type === "list") return `<div class="page">
        <div class="page-head"><span>Index</span><b>P.${String(i).padStart(2, "0")}</b><span>${groupName(p.items[0].group)} 等</span></div>
        ${p.items.map(entryHTML).join("")}
        <div class="pageno">— ${i} —</div>
      </div>`;
    if (p.type === "toc") {
      const byCat = {};
      links.forEach((l, idx) => { (byCat[l.group] = byCat[l.group] || []).push({ l, page: Math.floor(idx / PER) + 2 }); });
      return `<div class="page">
        <div class="page-head"><span>Contents</span><b>目录</b></div>
        ${Object.entries(byCat).map(([g, arr]) => `<div class="entry" data-jump="${arr[0].page}" style="cursor:pointer">
            <span><h3>${emojiOf(g)} ${groupName(g)}<small>${arr.length} entries</small></h3>
            <p>${arr.map(x => x.l.name).join(" · ")}</p></span>
            <span class="visits">P.${arr[0].page}</span></div>`).join("")}
        <div class="pageno">— ${i} —</div>
      </div>`;
    }
    if (p.type === "blank") return `<div class="page"></div>`;
    const totalV = Object.values(stats).reduce((s, x) => s + (x.c || 0), 0);
    const top = Object.entries(stats).sort((a, b) => b[1].c - a[1].c).slice(0, 3)
      .map(([u, x]) => { const l = links.find(k => k.url === u); return l ? `${l.name}（${x.c}）` : ""; }).filter(Boolean).join("　");
    return `<div class="cover" style="height:100%;cursor:default">
        <div class="frame"></div>
        <div class="est">Colophon</div>
        <h1 style="font-size:30px">本期完</h1>
        <div class="issue">收录 ${links.length} 条目 · 总访问 ${totalV} 次<br>${top ? "最常翻阅：" + top : ""}<br><br>点底部 ✎ 可视化编辑 · 导出 config.js 永久固化<br>数据存于本机浏览器</div>
      </div>`;
  };

  // ── 建 DOM：两张页 = 一张纸（front=偶数页, back=奇数页） ──
  const book = $("#book");
  const N = pages.length / 2;
  book.innerHTML = Array.from({ length: N }, (_, k) =>
    `<div class="sheet" data-k="${k}">
      <div class="face front">${pageHTML(pages[2 * k], 2 * k)}<div class="gloss"></div></div>
      <div class="face back">${pageHTML(pages[2 * k + 1], 2 * k + 1)}<div class="gloss"></div></div>
    </div>`).join("");
  const sheets = [...book.children];
  // 装饰层：书口毛边 / 中缝 / 翻动投影（置于页面之下，动画时投影浮于页上）
  book.insertAdjacentHTML("beforeend",
    `<div class="edge r"></div><div class="edge l"></div><div id="gutter"></div><div id="cast"></div>`);
  const cast = $("#cast");

  let f = 0;            // 已翻过的页数
  let busy = false;

  // ── 翻页音效：WebAudio 合成纸张"唰"声，无外部文件 ──
  let ac = null;
  const soundOn = () => localStorage.getItem("nav.sound") !== "off";
  function sfxFlip(strong = true) {
    if (!soundOn()) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
      const dur = strong ? .26 : .13, t = ac.currentTime;
      const buf = ac.createBuffer(1, Math.round(ac.sampleRate * dur), ac.sampleRate);
      const ch = buf.getChannelData(0);
      for (let i = 0; i < ch.length; i++) {
        const x = i / ch.length;
        ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - x, strong ? 1.7 : 2.8) * (strong ? .6 : .35);
      }
      const src = ac.createBufferSource(); src.buffer = buf;
      src.playbackRate.value = .8 + Math.random() * .5;
      const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = .9;
      const f0 = (strong ? 800 : 1500) * (.85 + Math.random() * .3);
      bp.frequency.setValueAtTime(f0, t);
      bp.frequency.exponentialRampToValueAtTime(f0 * (strong ? 3 : .55), t + dur);
      const g = ac.createGain();
      g.gain.setValueAtTime(strong ? .5 : .22, t);
      g.gain.exponentialRampToValueAtTime(.001, t + dur);
      src.connect(bp).connect(g).connect(ac.destination);
      src.start(t); src.stop(t + dur);
    } catch {}
  }
  const sndBtn = $("#sndBtn");
  const paintSnd = () => sndBtn.textContent = soundOn() ? "🔊" : "🔇";
  paintSnd();
  sndBtn.onclick = () => {
    localStorage.setItem("nav.sound", soundOn() ? "off" : "on");
    paintSnd();
    if (soundOn()) sfxFlip(false);
  };

  function layout() {
    sheets.forEach((s, i) => {
      s.classList.toggle("flipped", i < f);
      s.style.zIndex = i < f ? 100 + i : 100 - i;
    });
    book.classList.toggle("closed", f === 0);
    book.style.setProperty("--tx", f === 0 ? "-205px" : "0px");
    $("#pgNo").textContent = f === 0 ? "封面" : `P.${2 * f - 1} · ${2 * f} / ${pages.length - 1}`;
    if (f === N) setTimeout(() => speak("一口气读到封底啦！本期完 ✦ 明天继续"), 1200);
    const q = $("#q"); if (q && f > 0) setTimeout(() => { try { q.focus(); } catch {} }, 900);
  }
  function flipTo(target, dur = 950) {
    target = Math.max(0, Math.min(N, target));
    if (busy || drag || target === f) return;
    busy = true;
    const dir = target > f ? 1 : -1;
    const step = () => {
      if (f === target) { busy = false; return; }
      const s = dir > 0 ? sheets[f] : sheets[f - 1];
      // 开/合封面时同步整本书的居中位移
      if (dir > 0 && f === 0) { book.classList.remove("closed"); book.style.setProperty("--tx", "0px"); speak("开刊啦 ✦ 第一页可以检索条目"); }
      if (dir < 0 && f === 1) { book.classList.add("closed"); book.style.setProperty("--tx", "-205px"); }
      sfxFlip(true);
      s.style.setProperty("--dur", dur + "ms");
      cast.style.setProperty("--dur", dur + "ms");
      s.style.zIndex = 500;
      s.classList.add(dir > 0 ? "fwd" : "bwd");
      cast.classList.remove("on"); void cast.offsetWidth; cast.classList.add("on");
      s.addEventListener("animationend", () => {
        s.classList.remove("fwd", "bwd");
        s.classList.toggle("flipped", dir > 0);
        f += dir;
        layout();
        step();
      }, { once: true });
    };
    step();
  }
  const next = () => flipTo(f + 1, 950);
  const prev = () => flipTo(f - 1, 820);
  layout();

  // ── 交互：点书页翻面（避开输入框/按钮/链接） ──
  book.addEventListener("click", e => {
    if (e.target.closest("input, button, a, .entry")) return;
    const face = e.target.closest(".face");
    if (!face) return;
    if (face.classList.contains("front")) next(); else prev();
  });
  $("#nextBtn").onclick = next;
  $("#prevBtn").onclick = prev;
  addEventListener("keydown", e => {
    if (document.activeElement === $("#q")) { if (e.key === "Escape") $("#q").blur(); return; }
    if (e.key === "ArrowRight") next();
    if (e.key === "ArrowLeft") prev();
  });

  // ── 鼠标拖拽跟随翻页：纸角实时跟手，松手按进度/甩速决定翻过或弹回 ──
  let drag = null, suppressClick = false;
  book.addEventListener("click", e => {
    if (suppressClick) { suppressClick = false; e.preventDefault(); e.stopPropagation(); }
  }, true);
  book.addEventListener("pointerdown", e => {
    suppressClick = false;
    if (busy || e.button !== 0) return;
    if (e.target.closest("input, button, a, .entry")) return;
    const face = e.target.closest(".face");
    if (!face) return;
    const dir = face.classList.contains("front") ? 1 : -1;
    const k = dir > 0 ? f : f - 1;
    if (k < 0 || k >= N) return;
    drag = { dir, s: sheets[k], x0: e.clientX, p: 0, moved: false, t0: performance.now() };
  });
  addEventListener("pointermove", e => {
    if (!drag) return;
    const rw = drag.s.getBoundingClientRect().width || 410;
    const dx = drag.dir > 0 ? drag.x0 - e.clientX : e.clientX - drag.x0;
    drag.p = Math.max(0, Math.min(1, dx / (rw * 1.4)));
    if (!drag.moved && drag.p < .03) return;
    drag.moved = true;
    const q = drag.dir > 0 ? drag.p : 1 - drag.p;   // 页面当前角度（0=右，1=左）
    drag.s.style.zIndex = 500;
    drag.s.style.transform = `rotateY(${-180 * q}deg) translateZ(${Math.sin(q * Math.PI) * 34}px)`;
    cast.style.opacity = Math.sin(q * Math.PI).toFixed(3);
  });
  addEventListener("pointerup", () => {
    if (!drag) return;
    const { dir, s, p, moved, t0 } = drag;
    drag = null;
    cast.style.opacity = "";
    if (!moved) { s.style.transform = s.style.zIndex = ""; return; }
    suppressClick = true;
    const flip = p > .45 || (p > .15 && performance.now() - t0 < 220);
    const endQ = flip ? (dir > 0 ? 1 : 0) : (dir > 0 ? 0 : 1);
    s.style.transition = "transform .42s cubic-bezier(.3,.1,.2,1)";
    requestAnimationFrame(() => { s.style.transform = `rotateY(${-180 * endQ}deg)`; });
    let gone = false;
    const done = () => {
      if (gone) return; gone = true;
      s.style.transition = s.style.transform = "";
      if (flip) f += dir;
      layout();
      sfxFlip(flip);
    };
    s.addEventListener("transitionend", done, { once: true });
    setTimeout(done, 520);
  });

  // ── 搜索：匹配后翻到对应页并高亮 ──
  const pageOf = url => Math.floor(links.findIndex(l => l.url === url) / PER) + 2;
  book.addEventListener("input", e => {
    if (e.target.id !== "q") return;
    const v = e.target.value.trim().toLowerCase();
    const line = $("#resLine");
    if (!v) { line.innerHTML = `共收录 <b>${links.length}</b> 条`; return; }
    const hits = links.filter(l => [l.name, l.desc, host(l.url), groupName(l.group), ...(l.tags || [])]
      .some(s => (s || "").toLowerCase().includes(v)));
    line.innerHTML = hits.length ? `匹配 <b>${hits.length}</b> 条` : "未寻得相关条目";
  });
  book.addEventListener("keydown", e => {
    if (e.target.id !== "q" || e.key !== "Enter") return;
    const v = e.target.value.trim().toLowerCase();
    const hit = links.find(l => [l.name, l.desc, host(l.url), groupName(l.group), ...(l.tags || [])]
      .some(s => (s || "").toLowerCase().includes(v)));
    if (hit) {
      const target = Math.ceil(pageOf(hit.url) / 2);
      const steps = Math.abs(target - f);
      flipTo(target, 300);
      speak(`起锚，带你翻到「${hit.name}」那一页 🌊`);
      setTimeout(() => {
        const el = book.querySelector(`.entry[data-url=${JSON.stringify(hit.url)}]`);
        if (el) { el.classList.add("spot"); setTimeout(() => el.classList.remove("spot"), 2600); }
      }, steps * 300 + 500);
    }
  });

  // ── 访问统计：点击条目即计数（与另两版互通） ──
  book.addEventListener("click", e => {
    const a = e.target.closest("a.entry");
    if (!a) return;
    const s = stats[a.dataset.url] || { c: 0, t: 0 };
    s.c++; s.t = Date.now();
    stats[a.dataset.url] = s;
    localStorage.setItem("nav.stats", JSON.stringify(stats));
  });
  // 目录页点击跳转
  book.addEventListener("click", e => {
    const t = e.target.closest("[data-jump]");
    if (t) flipTo(Math.ceil(+t.dataset.jump / 2), 300);
  });

  // ── 自适应缩放 ──
  function fit() {
    const s = Math.min(1, (innerWidth - 40) / 850, (innerHeight - 120) / 620);
    book.style.setProperty("--s", Math.max(.4, s));
  }
  fit(); addEventListener("resize", fit);

  // ── DeepSeek 鲸鱼娘：会走 / 爬 / 游泳，可文字互动 ──
  const pet = $("#mascot"), petBubble = $("#mBubble"), petChip = $("#petChip");
  const rig = pet.querySelector(".rig"), mChat = $("#mChat"), mIn = $("#mIn");
  let petT = 0;
  const speak = m => {
    petBubble.textContent = m; petBubble.classList.add("show");
    clearTimeout(petT); petT = setTimeout(() => petBubble.classList.remove("show"), 4200);
  };
  const rnd = (a, b) => a + Math.random() * (b - a);
  const reduceMotion = matchMedia("(prefers-reduced-motion:reduce)").matches;
  let chatOpen = false;

  // 移动状态机：home / walk / crawl / swim / back
  let mode = "home", mx = 0, my = 0, mTarget = 0, rot = 0, fx = 1;
  let nextAt = performance.now() + 9000, swim = null, bubT = 0, vy = 0, dzT = 0;
  const petH = () => pet.offsetHeight || 229;
  const dockX = () => Math.max(10, innerWidth - 26 - 140);
  const dockY = () => innerHeight - 84 - petH();
  const goHome = () => { mx = dockX(); my = dockY(); };
  goHome(); pet.style.left = mx + "px"; pet.style.top = my + "px";
  const spawnBub = () => {
    const b = document.createElement("i"); b.className = "bub";
    b.style.left = (mx + rnd(40, 100)) + "px"; b.style.top = (my + rnd(80, 150)) + "px";
    document.body.appendChild(b); setTimeout(() => b.remove(), 1400);
  };
  const doWalk = () => { mode = "walk"; mTarget = rnd(30, Math.max(60, dockX() - 40)); speak("走到那边看看～ 🐾"); };
  const doCrawl = () => { mode = "crawl"; mTarget = rnd(30, Math.max(60, dockX() - 60)); speak("我爬～我爬爬爬…🐌"); };
  const doSwim = () => {
    mode = "swim";
    const l2r = mx > innerWidth / 2; fx = l2r ? 1 : -1;
    swim = { t: 0, dur: 6, x0: l2r ? -160 : innerWidth + 20, x1: l2r ? innerWidth + 20 : -160, base: rnd(innerHeight * .25, innerHeight * .55) };
    speak("让个道，我要游过去啦 🌊");
  };
  const startTrick = () => {
    const r = Math.random();
    if (r < .4) doWalk(); else if (r < .7) doSwim(); else if (r < .9) doCrawl();
    else nextAt = performance.now() + rnd(6000, 12000);
  };
  let last = performance.now();
  function tick(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (mode === "home") {
      rot *= .85;
      mx += (dockX() - mx) * Math.min(1, dt * 6);
      my += (dockY() - my) * Math.min(1, dt * 6);
      if (!reduceMotion && !chatOpen && now > nextAt && !pet.classList.contains("gone")) startTrick();
    } else if (mode === "walk" || mode === "crawl" || mode === "back") {
      const tgt = mode === "back" ? dockX() : mTarget;
      const dir = Math.sign(tgt - mx) || 1; fx = dir;
      const v = mode === "crawl" ? (Math.sin(now / 260) > .2 ? 34 : -4) : 95;
      mx = dir > 0 ? Math.min(tgt, mx + v * dt) : Math.max(tgt, mx - v * dt);
      rot = mode === "crawl" ? -88 : Math.sin(now / 85) * (mode === "back" ? 2 : 4);
      my = mode === "crawl" ? innerHeight - 82 - petH() / 2 : dockY();
      if (Math.abs(mx - tgt) < 2) {
        mx = tgt;
        if (mode === "back") { mode = "home"; rot = 0; nextAt = now + rnd(7000, 14000); }
        else mode = "back";
      }
    } else if (mode === "drag") {
      rot *= .8;
    } else if (mode === "fall") {
      vy += 2200 * dt; my += vy * dt;
      rot = Math.max(-14, Math.min(14, vy * .02));
      if (my >= dockY()) {
        my = dockY(); vy = -Math.abs(vy) * .42; pop("💦", .7);
        if (Math.abs(vy) < 130) { vy = 0; mode = "home"; nextAt = now + rnd(5000, 9000); speak("呼～稳稳落地 🐋"); }
      }
    } else if (mode === "dizzy") {
      dzT += dt;
      rot = Math.sin(dzT * 11) * 22 * Math.max(0, 1 - dzT / 1.6);
      if (dzT > 1.6) { mode = "home"; rot = 0; nextAt = now + rnd(6000, 12000); }
    } else if (mode === "swim" && swim) {
      swim.t += dt;
      const p = Math.min(1, swim.t / swim.dur);
      mx = swim.x0 + (swim.x1 - swim.x0) * p;
      my = swim.base + Math.sin(swim.t * 2.2) * 66 - petH() / 2;
      rot = Math.cos(swim.t * 2.2) * 12 * (swim.x1 > swim.x0 ? 1 : -1);
      bubT += dt; if (bubT > .3) { bubT = 0; spawnBub(); }
      if (p >= 1) { swim = null; rot = 0; my = dockY(); mode = "back"; }
    }
    pet.style.left = mx + "px"; pet.style.top = my + "px";
    rig.style.transform = `scaleX(${fx}) rotate(${rot}deg)`;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  addEventListener("resize", () => { if (mode === "home") goHome(); });

  // ── 文字互动：点鲸鱼娘开聊，规则引擎应答，会记住你的名字 ──
  let petName = localStorage.getItem("nav.petname") || "";
  const replies = [
    [/你记得我叫|我叫(什么|啥)|我的名字|叫什么|你叫我/, () => petName ? `当然，你是 ${petName} 呀 🐋` : "我还不知道你叫什么？说「我叫××」试试"],
    [/我叫\s*([^\s，。,!？?什么啥]{1,12})/, m => {
      petName = m[1]; localStorage.setItem("nav.petname", petName);
      return `记住啦，${petName}！以后就这样称呼你 ✦`;
    }],
    [/你好|您好|嗨|hi|hello/i, () => petName ? `你好呀，${petName}～我是鲸鱼娘 🐋 这本小杂志由我看守！` : "你好呀～我是鲸鱼娘 🐋 这本小杂志由我看守！"],
    [/你是谁|名字|叫啥/i, "DeepSeek 鲸鱼娘，星航海号首席领航员 ✦ 会翻页、会游泳、会聊天。"],
    [/怎么翻|翻页|翻书/i, "点书页右半边往前翻、左半边往后翻；也可以按住书页拖动，纸页会跟你的手走～"],
    [/搜索|检索|查|找/i, "翻开第一页输入关键词回车，我就带你飞过去 🌊"],
    [/笑话|无聊|搞笑/i, "为什么书签喜欢挤在一起？因为它们都想被「翻」新……噗我自己先笑了"],
    [/天气|星星/i, "我这片星空常年晴，一百三十颗星星颗颗都在眨眼 ✦"],
    [/吃饭|饿|白饭|肥鱼|胖/i, "才不是大肥鱼！这叫圆润！……没吃饱喵 🐱"],
    [/config|配置|添加|删除|改书签/i, "编辑 config.js 就能增删书签；你的排序和统计都存在本机浏览器，不上传任何地方。"],
    [/游泳|游一个|游一下/, "看好了——鲸鱼式，出发！🌊"],
    [/爬|走一个|走动|动一动|运动/, "好嘞，给你表演一段 🐾"],
    [/再见|拜拜/i, "下次再来翻我～ ✦"],
    [/谢谢|感谢|厉害|棒/i, "嘿嘿，被夸得尾巴都要翘起来了 🐋"],
  ];
  const chatFallback = ["嗯嗯？再说一遍嘛～", "这个我还不懂，但我会努力学的！", "试试问我：怎么翻页？会什么动作？讲个笑话？", "（歪头，头顶喷水孔冒了个小泡）"];
  const chatAct = v => {
    if (/游泳|游一个|游一下/.test(v)) doSwim();
    else if (/爬/.test(v)) doCrawl();
    else if (/走|动一动|运动/.test(v)) doWalk();
  };
  const sendChat = () => {
    const v = mIn.value.trim(); if (!v) return;
    mIn.value = "";
    const hit = replies.find(([re]) => re.test(v));
    const txt = hit ? (typeof hit[1] === "function" ? hit[1](v.match(hit[0])) : hit[1])
                    : chatFallback[Math.floor(Math.random() * chatFallback.length)];
    setTimeout(() => speak(txt), 450);
    setTimeout(() => chatAct(v), 950);
  };
  const openChat = () => { chatOpen = true; mChat.style.display = "flex"; mIn.focus(); speak("想聊点什么？打字给我看 ✍️（Esc 关闭）"); };
  const closeChat = () => { chatOpen = false; mChat.style.display = "none"; };
  $("#mSend").onclick = e => { e.stopPropagation(); sendChat(); };
  mIn.addEventListener("keydown", e => {
    e.stopPropagation();
    if (e.key === "Enter") sendChat();
    if (e.key === "Escape") closeChat();
  });
  $("#mActSwim").onclick = e => { e.stopPropagation(); doSwim(); };
  $("#mActWalk").onclick = e => { e.stopPropagation(); Math.random() < .5 ? doCrawl() : doWalk(); };
  // ── 鼠标拖动她：拎起来会扑腾冒星星，狂甩会头晕，半空松手会掉下去弹两下 ──
  const pop = (ch, size = 1) => {
    const s = document.createElement("i"); s.className = "fx"; s.textContent = ch;
    s.style.left = (mx + rnd(20, 110)) + "px"; s.style.top = (my + rnd(20, 120)) + "px";
    s.style.fontSize = (12 + 8 * size) + "px";
    document.body.appendChild(s); setTimeout(() => s.remove(), 1200);
  };
  const liftLines = ["啊啊啊要飞起来啦～ 🛫", "轻点拎，裙摆要乱啦！", "变成鲸鱼风筝咯 🪁", "去哪都行，别拔我头发！"];
  let dragPet = null, suppressPetClick = false;
  pet.addEventListener("pointerdown", e => {
    if (e.target.closest("#mHide,#mChat")) return;
    dragPet = { ox: e.clientX - mx, oy: e.clientY - my, moved: false, lx: e.clientX, dir: 0, shake: 0 };
    pet.classList.add("grabbing");
    mode = "drag";
  });
  addEventListener("pointermove", e => {
    if (!dragPet) return;
    const nx = e.clientX - dragPet.ox, ny = e.clientY - dragPet.oy;
    if (Math.abs(nx - mx) + Math.abs(ny - my) > 1) dragPet.moved = true;
    const vx = e.clientX - dragPet.lx; dragPet.lx = e.clientX;
    if (vx && Math.sign(vx) !== dragPet.dir) { dragPet.dir = Math.sign(vx); dragPet.shake++; }
    mx = Math.max(-20, Math.min(innerWidth - 120, nx));
    my = Math.max(-40, Math.min(innerHeight - 120, ny));
    rot = Math.max(-16, Math.min(16, vx * .9));
    if (dragPet.shake === 8) speak("别甩我啦，要转晕了 🌀");
    if (dragPet.moved && Math.random() < .015) speak(liftLines[Math.floor(Math.random() * liftLines.length)]);
    if (Math.random() < .04) pop(Math.random() < .5 ? "✨" : "💧", .7);
  });
  addEventListener("pointerup", () => {
    if (!dragPet) return;
    const d = dragPet; dragPet = null;
    pet.classList.remove("grabbing");
    if (!d.moved) { mode = "home"; nextAt = performance.now() + rnd(7000, 14000); return; }
    suppressPetClick = true;
    if (d.shake >= 12) { mode = "dizzy"; dzT = 0; speak("眼冒星星了…🌀✨"); }
    else if (my < innerHeight * .45) { mode = "fall"; vy = 0; speak("要掉下去啦——！"); }
    else { mode = "home"; nextAt = performance.now() + rnd(6000, 12000); }
  });
  let lastPat = 0, pats = 0;
  pet.onclick = e => {
    if (e.target.closest("#mHide,#mChat")) return;
    if (suppressPetClick) { suppressPetClick = false; return; }
    pet.classList.remove("jump"); void pet.offsetWidth; pet.classList.add("jump");
    const now = performance.now();
    pats = now - lastPat < 450 ? pats + 1 : 1; lastPat = now;
    if (pats >= 2) {
      pats = 0;
      for (let i = 0; i < 5; i++) setTimeout(() => pop("❤️", .8), i * 130);
      speak(petName ? `${petName}，被撸得好舒服…再、再来一下也可以 🐋❤️` : "被撸得好舒服…再、再来一下也可以 🐋❤️");
      return;
    }
    setTimeout(() => { if (pats === 1) (chatOpen ? closeChat() : openChat()); }, 260);
  };
  $("#mHide").onclick = e => {
    e.stopPropagation();
    localStorage.setItem("nav.mascot", "hidden");
    pet.classList.add("gone"); petChip.style.display = "grid"; closeChat();
  };
  petChip.onclick = () => {
    localStorage.removeItem("nav.mascot");
    pet.classList.remove("gone"); petChip.style.display = "none";
    goHome(); mode = "home"; speak("我又回来啦 🐋");
  };
  if (localStorage.getItem("nav.mascot") === "hidden") {
    pet.classList.add("gone"); petChip.style.display = "grid";
  } else {
    const hh = new Date().getHours();
    const hi = petName ? `${petName}，` : "";
    const greet = hh < 6 ? `${hi}这么晚还翻书，星星都困了你没有 🌙`
      : hh < 12 ? `${hi}早上好 ☀️ 今天想翻点什么？`
      : hh < 18 ? `${hi}下午好呀 ✦ 我把书签都擦亮啦`
      : `${hi}晚上好 🌙 星空和这本书都陪你`;
    setTimeout(() => speak(greet + "（点我聊天 · 双击撸我 · 也可以直接把我拖走）"), 1600);
  }
  // 日常碎碎念
  const idleLines = ["发呆中…zzZ", "外面好像下雨了，我们书里永远晴天 ✦", "偷偷说：封底藏着本期访问 Top3",
    "（练习游泳中）🌊", "今天也要元气满满地翻书呀", "把我拖到半空松手，我会掉下去弹两下哦"];
  setInterval(() => {
    if (mode === "home" && !chatOpen && !dragPet && !pet.classList.contains("gone") && Math.random() < .35)
      speak(idleLines[Math.floor(Math.random() * idleLines.length)]);
  }, 30000);

  // ── 书签管理抽屉：本机添加/编辑/删除自定义、隐藏源条目、导出完整 config.js ──
  const mgr = $("#mgr"), mgrBtn = $("#mgrBtn"), gGroup = $("#gGroup");
  cats.filter(c => c.id !== "all").forEach(c => gGroup.add(new Option(`${c.emoji} ${c.name}`, c.id)));
  let editing = -1;
  const gt = m => { $("#gTip").textContent = m; };
  const clearForm = () => { ["gName", "gUrl", "gDesc", "gTags"].forEach(id => $("#" + id).value = "");
    editing = -1; $("#gAdd").textContent = "✦ 添加"; $("#gCancel").style.display = "none"; };
  const saveExtra = () => localStorage.setItem("nav.extra", JSON.stringify(extra));
  function renderMgr() {
    const ex = $("#gExtra"); ex.innerHTML = "";
    if (!extra.length) ex.innerHTML = `<li><small>还没有自定义条目，用上方表单添加</small></li>`;
    extra.forEach((l, i) => {
      const li = document.createElement("li");
      li.innerHTML = `<span><b>${l.name}</b><br><small>${groupName(l.group)} · ${host(l.url)}</small></span>`;
      const be = document.createElement("button"); be.textContent = "✏️"; be.title = "编辑";
      be.onclick = () => { editing = i; $("#gName").value = l.name; $("#gUrl").value = l.url;
        $("#gDesc").value = l.desc || ""; $("#gTags").value = (l.tags || []).join(", ");
        gGroup.value = l.group; $("#gAdd").textContent = "✦ 保存修改"; $("#gCancel").style.display = ""; };
      const bd = document.createElement("button"); bd.textContent = "🗑"; bd.title = "删除";
      bd.onclick = () => { extra.splice(i, 1); saveExtra(); if (editing === i) clearForm(); renderMgr(); gt("已删除 ✓ 点「应用并刷新书页」生效"); };
      li.append(be, bd); ex.append(li);
    });
    const sr = $("#gSrc"); sr.innerHTML = "";
    CFG.links.filter(l => !hidden.includes(l.url)).forEach(l => {
      const li = document.createElement("li");
      li.innerHTML = `<span><b>${l.name}</b><br><small>${groupName(l.group)} · ${host(l.url)}</small></span>`;
      const bd = document.createElement("button"); bd.textContent = "🗑"; bd.title = "从书页隐藏（仅本机）";
      bd.onclick = () => { hidden.push(l.url); localStorage.setItem("nav.hidden", JSON.stringify(hidden)); renderMgr(); gt(`已隐藏「${l.name}」✓ 刷新后生效，可在下方恢复`); };
      li.append(bd); sr.append(li);
    });
    const hl = $("#gHid"); hl.innerHTML = "";
    if (!hidden.length) hl.innerHTML = `<li><small>无</small></li>`;
    hidden.forEach(u => {
      const src = CFG.links.find(k => k.url === u);
      const li = document.createElement("li");
      li.innerHTML = `<span><b>${src ? src.name : u}</b><br><small>已从书页隐藏（仅本机）</small></span>`;
      const br = document.createElement("button"); br.textContent = "↩"; br.title = "恢复显示";
      br.onclick = () => { hidden = hidden.filter(x => x !== u); localStorage.setItem("nav.hidden", JSON.stringify(hidden)); renderMgr(); gt("已恢复 ✓ 点「应用并刷新书页」入书"); };
      li.append(br); hl.append(li);
    });
  }
  mgrBtn.onclick = () => { mgr.classList.add("open"); renderMgr();
    if (!pet.classList.contains("gone")) speak("要往杂志里添条目吗？我帮你记着 ✍️"); };
  $("#mgrClose").onclick = () => mgr.classList.remove("open");
  addEventListener("keydown", e => { if (e.key === "Escape" && mgr.classList.contains("open")) mgr.classList.remove("open"); });
  mgr.querySelectorAll("input,select").forEach(el => {
    el.addEventListener("keydown", e => e.stopPropagation());
  });
  $("#gAdd").onclick = () => {
    const n = $("#gName").value.trim(), u0 = $("#gUrl").value.trim();
    if (!n || !u0) { gt("⚠️ 名称和链接为必填"); return; }
    const url = /^https?:\/\//i.test(u0) ? u0 : "https://" + u0;
    const item = { name: n, url, desc: $("#gDesc").value.trim(), group: gGroup.value, icon: "",
      tags: $("#gTags").value.split(/[,，]/).map(s => s.trim()).filter(Boolean) };
    const wasEdit = editing >= 0;
    if (wasEdit) extra[editing] = item; else extra.push(item);
    saveExtra(); clearForm(); renderMgr();
    gt(wasEdit ? "已保存修改 ✓ 点「应用并刷新书页」生效" : "已添加 ✓ 点「应用并刷新书页」生效");
  };
  $("#gCancel").onclick = clearForm;
  $("#gApply").onclick = () => location.reload();
  $("#gExport").onclick = () => {
    const out = JSON.parse(JSON.stringify(CFG));
    out.links = [...CFG.links.filter(l => !hidden.includes(l.url)), ...JSON.parse(JSON.stringify(extra))];
    const ord = readLS("nav.order", []);
    if (ord.length) { const oi = u => { const i = ord.findIndex(o => o.u === u); return i === -1 ? Infinity : i; };
      out.links.sort((a, b) => oi(a.url) - oi(b.url)); }
    const code = "window.NAV_CONFIG = " + JSON.stringify(out, null, 2) + ";\n";
    navigator.clipboard.writeText(code)
      .then(() => gt("📋 完整配置已复制到剪贴板：粘贴替换 config.js 即永久固化"))
      .catch(() => { gt("复制失败，配置已输出到浏览器控制台 (F12)"); console.log(code); });
  };

  // ── 星空 ──
  const cv = $("#stars"), ctx = cv.getContext("2d");
  let stars = [];
  function resize() {
    cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
    stars = Array.from({ length: 130 }, () => ({
      x: Math.random() * cv.width, y: Math.random() * cv.height,
      r: (Math.random() * 1.3 + .3) * devicePixelRatio,
      a: Math.random() * Math.PI * 2, s: Math.random() * .02 + .004 }));
  }
  resize(); addEventListener("resize", resize);
  (function loop() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const st of stars) {
      st.a += st.s;
      const alpha = (Math.sin(st.a) + 1) / 2 * .85 + .05;
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 7);
      ctx.fillStyle = `rgba(220,225,255,${alpha})`; ctx.fill();
    }
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
